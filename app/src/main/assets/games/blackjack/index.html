<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blackjack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header>
        <h1>BLACKJACK</h1>
        <div class="stats">
            <div class="stat">
                <span>Apuesta</span>
                <strong class="bet-value" id="betDisplay">$0</strong>
            </div>
            <div class="stat">
                <span>Saldo</span>
                <strong id="balanceDisplay">$1000</strong>
            </div>
        </div>
    </header>

    <section class="table">
        <div class="area">
            <div class="label">Crupier <span class="score" id="dealerScore"></span></div>
            <div class="cards" id="dealerCards"></div>
        </div>

        <div class="divider">
            <div id="message">Haz tu apuesta</div>
        </div>

        <div class="area">
            <div class="label">Jugador</div>
            <div class="hands" id="playerHands"></div>
        </div>
    </section>

    <section class="controls">
        <div class="row" id="chips">
            <button class="chip chip-5"   data-value="5">5</button>
            <button class="chip chip-25"  data-value="25">25</button>
            <button class="chip chip-100" data-value="100">100</button>
            <button class="chip chip-500" data-value="500">500</button>
        </div>

        <div class="row" id="actions">
            <button id="btnDeal"   class="btn-primary">Repartir</button>
            <button id="btnClear"  class="btn-ghost">Limpiar</button>
            <button id="btnRepeat" class="btn-ghost">Repetir apuesta</button>

            <button id="btnHit"    class="btn-primary">Pedir</button>
            <button id="btnStand"  class="btn-gold">Plantarse</button>
            <button id="btnDouble" class="btn-danger">Doblar</button>
            <button id="btnSplit"  class="btn-ghost">Dividir</button>

            <button id="btnNext"   class="btn-primary">Nueva mano</button>
        </div>

        <div class="hint">
            Blackjack paga 3:2 · El crupier se planta en 17 · Se juega con 6 barajas
        </div>
    </section>

</div>

<script src="blackjack.js.js"></script>
</body>
</html>
