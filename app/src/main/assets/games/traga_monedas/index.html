<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Slot Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header>
        <div class="brand">
            SLOTS
            <small>DELUXE</small>
        </div>
        <div class="stats">
            <div class="stat">
                <span>Apuesta</span>
                <strong class="gold" id="totalBet">$25</strong>
            </div>
            <div class="stat">
                <span>Saldo</span>
                <strong id="balance">$1000</strong>
            </div>
            <button class="icon-btn" id="muteBtn" title="Sonido">🔊</button>
        </div>
    </header>

    <div class="machine">
        <div class="reels" id="reels">
            <div class="reel" data-reel="0"><div class="strip"></div></div>
            <div class="reel" data-reel="1"><div class="strip"></div></div>
            <div class="reel" data-reel="2"><div class="strip"></div></div>

            <svg class="lines" viewBox="0 0 300 300">
                <path class="payline" data-line="0" d="M 0,50 L 300,50"       pathLength="100"/>
                <path class="payline" data-line="1" d="M 0,150 L 300,150"      pathLength="100"/>
                <path class="payline" data-line="2" d="M 0,250 L 300,250"      pathLength="100"/>
                <path class="payline" data-line="3" d="M 0,0 L 300,300"        pathLength="100"/>
                <path class="payline" data-line="4" d="M 0,300 L 300,0"        pathLength="100"/>
            </svg>
        </div>

        <div class="win-display">
            <div id="winText">¡Buena suerte!</div>
            <div class="win-sub" id="winSub">5 líneas activas</div>
        </div>
    </div>

    <div class="controls">

        <div class="bet-row">
            <button id="betDown">−</button>
            <div class="bet-info">
                <span>Apuesta por línea</span>
                <strong id="betPerLine">$5</strong>
            </div>
            <button id="betUp">+</button>
        </div>

        <div class="payline-legend">
            <div class="pl-dot" style="color:#ff4d6d;background:#ff4d6d"></div>
            <div class="pl-dot" style="color:#4dabf7;background:#4dabf7"></div>
            <div class="pl-dot" style="color:#3fd67a;background:#3fd67a"></div>
            <div class="pl-dot" style="color:#cc5de8;background:#cc5de8"></div>
            <div class="pl-dot" style="color:#ff922b;background:#ff922b"></div>
        </div>

        <button class="spin-btn" id="spinBtn">GIRAR</button>

        <div class="row">
            <button class="btn" id="maxBetBtn">MAX</button>
            <button class="btn" id="autoBtn">AUTO</button>
            <button class="btn" id="paytableBtn">PAGOS</button>
        </div>

        <div class="hint" id="hint">
            Pulsa <b>ESPACIO</b> para girar · 3 iguales pagan · 2 iguales en las dos primeras pagan
        </div>
    </div>

</div>

<!-- MODAL PAYTABLE -->
<div class="modal" id="payModal">
    <div class="modal-box">
        <h2>TABLA DE PAGOS</h2>
        <h3>3 iguales en una línea</h3>
        <div class="pay-table" id="pay3Table"></div>
        <h3>2 iguales (primeras 2 casillas)</h3>
        <div class="pay-table" id="pay2Table"></div>
        <button class="modal-close" id="modalClose">CERRAR</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
